<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>A Heart For My Love</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

.message {
    position: fixed;
    top: 35px;
    left: 50%;
    transform: translateX(-50%);

    color: white;
    font-family: Arial, sans-serif;
    font-size: 18px;

    z-index: 10;
    text-align: center;

    text-shadow:
        0 0 10px #ff4d9d,
        0 0 20px #ff4d9d;
}

.title {
    position: fixed;
    bottom: 35px;
    width: 100%;

    text-align: center;

    color: #fff;
    font-family: Arial, sans-serif;
    font-size: 28px;

    text-shadow:
        0 0 10px #ff4d9d,
        0 0 25px #ff4d9d;
}

</style>
</head>

<body>

<div class="message">This is for you ❤️</div>

<div class="title">A Heart For My Love</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.z = 35;


const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(renderer.domElement);


// PARTICLES

const count = 3500;

const positions = new Float32Array(count * 3);

for (let i = 0; i < count; i++) {

    const t = Math.random() * Math.PI * 2;

    const x =
        16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);


    const scale = 0.55 + Math.random() * 0.5;

    positions[i * 3] =
        x * scale;

    positions[i * 3 + 1] =
        y * scale;

    positions[i * 3 + 2] =
        (Math.random() - 0.5) * 5;
}


const geometry =
    new THREE.BufferGeometry();

geometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        positions,
        3
    )
);


// PARTICLE MATERIAL

const material =
    new THREE.PointsMaterial({

        color: 0xff4d9d,

        size: 0.13,

        transparent: true,

        opacity: 0.9,

        blending:
            THREE.AdditiveBlending

    });


const heart =
    new THREE.Points(
        geometry,
        material
    );

scene.add(heart);


// ANIMATION

function animate() {

    requestAnimationFrame(animate);

    heart.rotation.y += 0.003;

    heart.rotation.x =
        Math.sin(Date.now() * 0.0005) * 0.08;

    renderer.render(
        scene,
        camera
    );
}

animate();


// RESIZE

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
